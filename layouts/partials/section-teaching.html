<section id="teaching" class="section">
  <p class="eyebrow">02 &mdash; Teaching Experience</p>
  <h2>Teaching Experience</h2>
  <ul class="entry-list">
    {{ range .Site.Data.teaching }}
    <li class="entry">
      <div class="entry-date">{{ .years }}</div>
      <div class="entry-body">
        <div class="entry-title">{{ .university }}</div>
        <div class="entry-subtitle">{{ .role }}</div>
        {{ with .courses }}
        <ul class="course-list">
          {{ range . }}<li>{{ . }}</li>{{ end }}
        </ul>
        {{ end }}
      </div>
    </li>
    {{ end }}
  </ul>
</section>
